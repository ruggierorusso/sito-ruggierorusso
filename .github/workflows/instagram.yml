name: Aggiorna Instagram

on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 06:17 (ora italiana, ora solare)
  workflow_dispatch: {}      # avvio manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow
        run: pip install pillow==11.3.0

      - name: Rinnova il token Instagram (dura 60 giorni)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | python -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -n "$NEW" ] && [ -n "$GH_PAT" ]; then
            echo "$NEW" | GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "Token rinnovato"
          else
            echo "Token non rinnovato (manca GH_PAT oppure risposta vuota)"
          fi

      - name: Scarica i post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python instagram_sync.py

      - name: Rigenera il sito
        run: python build.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nessun post nuovo"; else git commit -m "Instagram: aggiornamento automatico" && git push; fi
