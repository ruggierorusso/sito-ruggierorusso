<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione richiesta — Erre Studio</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#000;color:#fff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .w{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  .brand{letter-spacing:.3em;font-size:12px;color:#a6a6a6;text-transform:uppercase}
  h1{font:600 30px Georgia,serif;margin:6px 0 18px} h2{font:600 20px Georgia,serif;margin:0 0 10px}
  .card{background:#111;border:1px solid #2b2b2b;border-radius:14px;padding:18px;margin:14px 0}
  .muted{color:#a6a6a6} a{color:#fff}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:#2b2b2b}
  label{display:block;font-size:13px;color:#a6a6a6;margin:10px 0 4px}
  input,textarea{width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid #2b2b2b;border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
  .row{display:flex;gap:8px}.row>*{flex:1}
  button,.btn{display:block;box-sizing:border-box;margin-top:12px;border:0;border-radius:999px;padding:13px 20px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;color:#fff;width:100%;text-align:center;text-decoration:none}
  button[disabled]{opacity:.5;cursor:wait}
  .ok{background:#2e7d32}.no{background:#b3402f}.alt{background:#fff;color:#000}
  .wa{background:#25D366;color:#000}.wab{background:#0b5e4a;color:#fff}.ghost{background:#2b2b2b}
  ul{padding-left:18px} li{margin:6px 0}
  .evid{outline:2px solid #fff}
  .err{border-color:#b3402f}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid #444;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  textarea[readonly]{font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="w">
  <div class="brand">Erre Studio</div>
  <h1 id="titolo">Caricamento…</h1>
  <div id="app"><p class="muted"><span class="spin"></span>Un attimo…</p></div>
</div>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbwnN7pz-czFrlavl53eQDHUJnFnumy5tuI9H_pOF-OQsgfvHvkBihMCClv8mqphiXOk2g/exec";
  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "", t = q.get("t") || "", scelta = q.get("scelta") || "";
  var chi = q.get("chi") === "cliente" ? "cliente" : "studio";
  var app = document.getElementById("app"), titolo = document.getElementById("titolo");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function set(t, html) { titolo.textContent = t; document.title = t + " — Erre Studio"; app.innerHTML = html; }
  function errore(msg) { set("Errore", '<div class="card err"><p>' + esc(msg) + '</p><p class="muted">Se il problema continua, apri la richiesta dal tuo Google Calendar o scrivici.</p></div>'); }

  function chiama(params) {
    var u = new URLSearchParams(params); u.set("azione", "api");
    return fetch(API + "?" + u.toString(), { method: "GET" }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.errore) throw new Error(j.errore);
      return j;
    });
  }

  // ---------- Elenco richieste ----------
  function elenco() {
    chiama({ op: "elenco", t: t }).then(function (j) {
      var riga = function (r) {
        return '<li><a href="?id=' + encodeURIComponent(r.id) + "&t=" + encodeURIComponent(r.t) + '"><b>' + esc(r.nome) + "</b></a> — " + esc(r.tipo) + ", " + esc(r.quando) + ' <span class="badge">' + esc(r.stato) + "</span></li>";
      };
      set("Richieste",
        '<div class="card"><h2>Da gestire (' + j.aperte.length + ")</h2>" + (j.aperte.length ? "<ul>" + j.aperte.map(riga).join("") + "</ul>" : '<p class="muted">Nessuna richiesta in attesa 🎉</p>') + "</div>" +
        '<div class="card"><h2>Gestite di recente</h2>' + (j.chiuse.length ? "<ul>" + j.chiuse.map(riga).join("") + "</ul>" : '<p class="muted">Ancora nessuna.</p>') + "</div>" +
        '<p class="muted" style="font-size:13px">Salva questa pagina tra i preferiti: è il tuo elenco delle richieste.</p>');
    }).catch(function (e) { errore(e.message); });
  }

  // ---------- Riepilogo ----------
  function scheda(r) {
    var c = r.cliente || {};
    var h = '<div class="card"><span class="badge">' + esc(r.statoTesto) + '</span><h2 style="margin-top:10px">' + esc(c.nome) + "</h2>";
    if (chi === "studio") h += '<div><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a> · <a href="tel:' + esc(String(c.telefono || "").replace(/\s/g, "")) + '">' + esc(c.telefono) + "</a></div>";
    h += "<p><b>" + esc(r.tipo) + "</b></p><ul>" + r.voci.map(function (v) { return "<li>" + esc(v.testo) + "</li>"; }).join("") + "</ul>";
    if (r.noleggio) h += "<p><b>" + esc(r.totale) + "</b></p>";
    if (chi === "cliente") h += '<p class="muted">📍 ' + esc(r.indirizzo) + "</p>";
    if (r.originale && r.originale.length) h += '<p class="muted">Richiesta originale: ' + esc(r.originale.join(", ")) + "</p>";
    if (c.note) h += '<p class="muted">Note: ' + esc(c.note) + "</p>";
    if (r.storia && r.storia.length) h += '<p class="muted" style="font-size:13px">' + r.storia.map(esc).join("<br>") + "</p>";
    return h + "</div>";
  }

  function msgCampo(ph) { return '<label>Messaggio per il cliente (facoltativo)</label><textarea name="messaggio" rows="2" placeholder="' + esc(ph) + '"></textarea>'; }
  function form(op, contenuto, bottone, classe, evid) {
    return '<form class="card' + (evid ? " evid" : "") + '" data-op="' + op + '">' + contenuto + '<button class="' + classe + '">' + bottone + "</button></form>";
  }

  // ---------- WhatsApp ----------
  function whatsapp(w) {
    if (!w || !w.numero) return '<div class="card"><h2>💬 WhatsApp</h2><p class="muted">Il numero del cliente non sembra valido per WhatsApp.</p></div>';
    var testo = encodeURIComponent(w.testo);
    return '<div class="card"><h2>💬 Conferma su WhatsApp</h2>' +
      "<p>Si apre la chat del cliente con il messaggio già scritto: controllalo e premi invia." + (w.referente ? ' <span class="muted">Referente: ' + esc(w.referente) + ".</span>" : "") + "</p>" +
      '<a class="btn wa" href="whatsapp://send?phone=' + w.numero + "&text=" + testo + '">💬 Invia da WhatsApp (personale)</a>' +
      '<a class="btn wab" href="whatsapp-smb://send?phone=' + w.numero + "&text=" + testo + '">🏢 Invia da WhatsApp Business</a>' +
      '<a class="btn ghost" href="https://wa.me/' + w.numero + "?text=" + testo + '" target="_blank" rel="noopener">Altro modo: apri con wa.me</a>' +
      '<button type="button" class="ghost" id="copia">📋 Copia il messaggio</button>' +
      '<textarea readonly rows="8" id="testoWa">' + esc(w.testo) + "</textarea></div>";
  }

  function collegaCopia() {
    var b = document.getElementById("copia"), ta = document.getElementById("testoWa");
    if (!b) return;
    b.onclick = function () {
      var fatto = function () { b.textContent = "✅ Copiato: incollalo nella chat"; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(fatto, function () { ta.select(); document.execCommand("copy"); fatto(); });
      else { ta.select(); document.execCommand("copy"); fatto(); }
    };
  }

  var ESITI = {
    accetta: ["Richiesta accettata", "✅ Fatto! Al cliente è arrivata l'email di conferma e in Google Calendar l'evento è diventato verde."],
    rifiuta: ["Richiesta rifiutata", "❌ Al cliente è arrivata un'email e l'evento è stato tolto da Google Calendar."],
    proponi: ["Proposta inviata", "📅 Abbiamo inviato al cliente la nuova proposta. In Google Calendar l'evento è stato spostato ed è giallo finché il cliente non risponde: riceverai un'email con la sua risposta."],
    "cliente-accetta": ["Confermato!", "✅ Perfetto! È tutto confermato: ti abbiamo inviato un'email di riepilogo. A presto da Erre Studio."],
    "cliente-rifiuta": ["Grazie per la risposta", "Abbiamo avvisato lo studio: ti ricontatteremo per trovare insieme un'altra data."],
  };

  // ---------- Pagina richiesta ----------
  function mostra(r) {
    var aperta = r.stato === "in attesa" || r.stato === "proposta inviata";
    var h = "", tit = chi === "studio" ? "Gestione richiesta" : "La tua richiesta";
    if (r.fatto && ESITI[r.fatto]) { tit = ESITI[r.fatto][0]; h += '<div class="card"><p>' + ESITI[r.fatto][1] + "</p></div>"; }

    if (chi === "studio") {
      if (r.stato === "confermata") h += whatsapp(r.whatsapp);
      h += scheda(r);
      if (aperta) {
        var campi = r.voci.map(function (v, i) {
          var d = v.minuti >= 60 && v.minuti % 60 === 0 ? v.minuti / 60 + " h" : v.minuti + " min";
          return "<label>" + (r.voci.length > 1 ? "Giorno " + (i + 1) + " — " : "") + "durata " + d + '</label><div class="row"><input type="date" name="data_' + i + '" value="' + esc(v.data) + '" required><input type="time" name="ora_' + i + '" value="' + esc(v.ora) + '" step="900" required></div>';
        }).join("");
        h += (r.stato === "in attesa"
          ? form("accetta", "<h2>✅ Accetta</h2>" + msgCampo("Es. Ti aspettiamo! Porta pure i tuoi abiti di scena."), "Accetta e avvisa il cliente", "ok", scelta === "accetta")
          : '<p class="muted">Hai già proposto un\'altra data: aspetta la risposta del cliente, oppure fai una nuova proposta o rifiuta.</p>') +
          form("proponi", "<h2>📅 Proponi un'altra data</h2>" + campi + msgCampo("Es. Quel giorno siamo impegnati, che ne dici di questa data?"), "Invia la proposta al cliente", "alt", scelta === "proponi") +
          form("rifiuta", "<h2>❌ Rifiuta</h2>" + msgCampo("Es. Purtroppo in quel periodo lo studio non è disponibile."), "Rifiuta e avvisa il cliente", "no", scelta === "rifiuta");
      }
      if (r.elenco) h += '<p><a href="' + esc(r.elenco) + '">← Tutte le richieste</a></p>';
    } else {
      if (r.stato === "proposta inviata") {
        tit = "Nuova data proposta";
        h += "<p>Ciao " + esc(r.cliente.nome) + ", ti proponiamo:</p>" + scheda(r) +
          (r.ultimoMessaggio ? '<p class="muted">“' + esc(r.ultimoMessaggio) + "”</p>" : "") +
          form("cliente-accetta", "", "✅ Accetto la nuova data", "ok") +
          form("cliente-rifiuta", "<label>Non va bene? Scrivici quando saresti disponibile (facoltativo)</label><textarea name=\"messaggio\" rows=\"2\"></textarea>", "Non va bene", "no");
      } else if (!r.fatto) {
        tit = "Grazie";
        h += '<div class="card"><p>Hai già risposto a questa proposta (' + esc(r.statoTesto) + '). Per qualsiasi cosa scrivici a <a href="mailto:' + esc(r.emailStudio) + '">' + esc(r.emailStudio) + "</a>.</p></div>";
      }
    }
    set(tit, h);
    collegaCopia();
    var ev = document.querySelector(".evid"); if (ev) ev.scrollIntoView({ block: "center" });
    Array.prototype.forEach.call(app.querySelectorAll("form[data-op]"), function (f) {
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        var op = f.getAttribute("data-op"), p = { op: op, id: id, t: t, chi: chi };
        Array.prototype.forEach.call(f.elements, function (el) { if (el.name) p[el.name] = el.value; });
        Array.prototype.forEach.call(app.querySelectorAll("button"), function (b) { b.disabled = true; });
        var b = f.querySelector("button"); b.innerHTML = '<span class="spin"></span>Un attimo…';
        chiama(p).then(function (r) { mostra(r); window.scrollTo(0, 0); }).catch(function (err) { errore(err.message); });
      });
    });
  }

  if (q.get("elenco")) return elenco();
  if (!id || !t) return errore("Link incompleto.");
  chiama({ op: "richiesta", id: id, t: t, chi: chi }).then(mostra).catch(function (e) { errore(e.message); });
})();
</script>
</body>
</html>
